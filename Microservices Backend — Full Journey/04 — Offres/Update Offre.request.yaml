$kind: http-request
url: "{{baseUrl}}/api/offres/{{offreId}}"
method: PUT
headers:
  Authorization: Bearer {{tokenRecruteur}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "salaire": 60000,
      "localisation": "Paris ou Remote"
    }
scripts:
  - type: afterResponse
    code: pm.test('Update offre 200', () => pm.response.to.have.status(200));
order: 4000
