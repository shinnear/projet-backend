$kind: collection
description: |-
  End-to-end Postman collection covering all 5 microservices through the API Gateway.

  Flow:
  1. Register candidat + recruteur + formateur
  2. Login each → save tokens
  3. Offres → CRUD
  4. Recommandations
  5. Formations → CRUD + inscription
  6. Quizz → create + submit
  7. Domaines
  8. MicroProjets → create + rejoindre
  9. CV → create
  10. Candidatures → submit + update statut
variables:
  baseUrl: http://localhost:3000
  tokenCandidat: ""
  tokenRecruteur: ""
  tokenFormateur: ""
  candidatId: ""
  recruteurId: ""
  formateurId: ""
  offreId: ""
  formationId: ""
  quizzId: ""
  domaineId: ""
  projetId: ""
  cvId: ""
  candidatureId: ""
  avisId: ""
