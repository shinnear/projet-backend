$kind: http-request
url: "{{baseUrl}}/api/avis"
method: POST
headers:
  Authorization: Bearer {{tokenRecruteur}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cibleId": "{{candidatId}}",
      "note": 4,
      "commentaire": "Très bon profil technique"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Avis created 201', () => pm.response.to.have.status(201));
      if (res.avis?._id) pm.collectionVariables.set('avisId', res.avis._id);
order: 3000
