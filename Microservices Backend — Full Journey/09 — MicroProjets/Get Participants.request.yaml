$kind: http-request
url: "{{baseUrl}}/api/microprojets/{{projetId}}/participants"
method: GET
headers:
  Authorization: Bearer {{tokenCandidat}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get participants 200', () => pm.response.to.have.status(200));
      pm.test('Candidat is participant', () => {
        const res = pm.response.json();
        pm.expect(res.participants).to.include(pm.collectionVariables.get('candidatId'));
      });
order: 5000
