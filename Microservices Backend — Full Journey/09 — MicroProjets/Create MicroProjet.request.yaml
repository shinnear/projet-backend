$kind: http-request
url: "{{baseUrl}}/api/microprojets"
method: POST
headers:
  Authorization: Bearer {{tokenRecruteur}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "titre": "Plateforme e-learning open-source",
      "description": "Construire une plateforme de cours en ligne avec Node.js, React et MongoDB.",
      "domaineId": "{{domaineId}}",
      "competencesRequises": ["JavaScript", "Node.js", "React"],
      "budget": 5000
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('MicroProjet created 201', () => pm.response.to.have.status(201));
      if (res.projet?._id) pm.collectionVariables.set('projetId', res.projet._id);
order: 1000
