$kind: http-request
url: "{{baseUrl}}/api/quizz"
method: POST
headers:
  Authorization: Bearer {{tokenFormateur}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "formationId": "{{formationId}}",
      "titre": "Évaluation Node.js",
      "dureeMax": 30,
      "questions": [
        {
          "enonce": "Quelle est la commande pour initialiser un projet Node.js ?",
          "choix": ["node init", "npm init", "node start", "npm start"],
          "bonneReponse": "npm init",
          "points": 2
        },
        {
          "enonce": "Quel module gère les routes dans Express ?",
          "choix": ["express.Router()", "express.Route()", "express.Path()", "express.Handler()"],
          "bonneReponse": "express.Router()",
          "points": 3
        },
        {
          "enonce": "Quel est le port par défaut de MongoDB ?",
          "choix": ["27017", "3306", "5432", "6379"],
          "bonneReponse": "27017",
          "points": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Quizz created 201', () => pm.response.to.have.status(201));
      if (res.quizz?._id) pm.collectionVariables.set('quizzId', res.quizz._id);
order: 1000
