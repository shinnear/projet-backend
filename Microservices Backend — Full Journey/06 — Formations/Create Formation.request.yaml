$kind: http-request
url: "{{baseUrl}}/api/formations"
method: POST
headers:
  Authorization: Bearer {{tokenFormateur}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "titre": "Node.js & Express — Du débutant à l'expert",
      "description": "Apprenez à construire des APIs REST robustes avec Node.js et Express.",
      "categorie": "Développement Web",
      "niveau": "intermédiaire",
      "duree": "20h",
      "contenu": ["Introduction à Node.js", "Express et routing", "MongoDB avec Mongoose", "JWT et sécurité", "Docker"]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Formation created 201', () => pm.response.to.have.status(201));
      if (res.formation?._id) pm.collectionVariables.set('formationId', res.formation._id);
order: 1000
