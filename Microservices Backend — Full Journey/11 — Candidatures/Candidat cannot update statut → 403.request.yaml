$kind: http-request
url: "{{baseUrl}}/api/candidatures/{{candidatureId}}/statut"
method: PUT
headers:
  Authorization: Bearer {{tokenCandidat}}
  Content-Type: application/json
body:
  type: text
  content: '{ "statut": "rejetée" }'
scripts:
  - type: afterResponse
    code: pm.test('Candidat blocked 403', () => pm.response.to.have.status(403));
order: 7000
