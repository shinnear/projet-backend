$kind: http-request
url: "{{baseUrl}}/api/candidatures/candidat/{{candidatId}}"
method: GET
headers:
  Authorization: Bearer {{tokenCandidat}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get candidatures 200', () => pm.response.to.have.status(200));
      pm.test('At least 1 candidature', () => pm.expect(pm.response.json().total).to.be.at.least(1));
order: 3000
