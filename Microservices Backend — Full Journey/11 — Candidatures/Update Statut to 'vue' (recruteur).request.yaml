$kind: http-request
url: "{{baseUrl}}/api/candidatures/{{candidatureId}}/statut"
method: PUT
headers:
  Authorization: Bearer {{tokenRecruteur}}
  Content-Type: application/json
body:
  type: text
  content: '{ "statut": "vue" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Update statut 200', () => pm.response.to.have.status(200));
      pm.test('Statut is vue', () => pm.expect(pm.response.json().candidature.statut).to.equal('vue'));
order: 5000
