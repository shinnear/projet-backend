$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Dupont",
      "prenom": "Alice",
      "email": "alice.dupont@example.com",
      "password": "password123",
      "role": "candidat",
      "competences": ["JavaScript", "Node.js", "MongoDB", "React"]
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Register candidat 201', () => pm.response.to.have.status(201));
      if (res.token) pm.collectionVariables.set('tokenCandidat', res.token);
      if (res.user?.id) pm.collectionVariables.set('candidatId', res.user.id);
order: 1000
