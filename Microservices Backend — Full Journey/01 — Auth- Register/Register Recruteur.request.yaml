$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nom": "Martin",
      "prenom": "Bob",
      "email": "bob.martin@example.com",
      "password": "password123",
      "role": "recruteur"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Register recruteur 201', () => pm.response.to.have.status(201));
      if (res.token) pm.collectionVariables.set('tokenRecruteur', res.token);
      if (res.user?.id) pm.collectionVariables.set('recruteurId', res.user.id);
order: 2000
