$kind: http-request
description: |-
  Étape 06/34.

  Créer une deuxième offre ; elle permettra de montrer une décision de rejet.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_offre_url}}/offres"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titre": "Journey Rejet {{fj_run}}",
      "description": "Offre créée pour vérifier la gestion des candidatures.",
      "typeContrat": "stage",
      "localisation": "Tunis",
      "statut": "active",
      "competencesRequises": [
        "Node.js",
        "MongoDB"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
       const j = pm.response.json();
      pm.test("Identifiant r\u00e9cup\u00e9r\u00e9 : ob", () => { const id = j.offre._id; pm.expect(id).to.be.a("string").and.match(/^[a-f0-9]{24}$/i); pm.collectionVariables.set("fj_ob", id); pm.variables.set("fj_ob", id); });

      }
      if (pm.response.code !== 201) { console.error("Prérequis échoué : arrêt du parcours."); pm.execution.setNextRequest(null); }
    language: text/javascript
order: 2000
