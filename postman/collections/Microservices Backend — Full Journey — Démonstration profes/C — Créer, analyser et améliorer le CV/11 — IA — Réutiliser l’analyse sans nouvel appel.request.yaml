$kind: http-request
description: |-
  Étape 11/34.

  Montrer le message Analyse déjà disponible et la même date d’analyse.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/{{fj_cv}}/analyse"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.message", () => { pm.expect(j.message).to.eql("Analyse déjà disponible"); });
      pm.test("M\u00eame analyse en cache", () => { pm.expect(j.analyseIA.dateAnalyse).to.eql(pm.collectionVariables.get("fj_ai_date")); });

      }
    language: text/javascript
order: 5000
