$kind: http-request
description: |-
  Étape 09/34.

  Afficher le document PDF généré. Si nécessaire, enregistrer la réponse en fichier .pdf puis l’ouvrir.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/{{fj_cv}}/pdf"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      pm.test("PDF valide et non mis en cache", () => { pm.expect(pm.response.headers.get("Content-Type")).to.include("application/pdf"); pm.expect(pm.response.headers.get("Content-Disposition")).to.include("attachment"); pm.expect(pm.response.headers.get("Cache-Control")).to.include("no-store"); pm.expect(pm.response.text().slice(0,5)).to.eql("%PDF-"); });
    language: text/javascript
order: 3000
