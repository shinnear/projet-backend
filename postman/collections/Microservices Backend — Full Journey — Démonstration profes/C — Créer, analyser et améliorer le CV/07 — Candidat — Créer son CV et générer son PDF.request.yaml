$kind: http-request
description: |-
  Étape 07/34.

  Montrer les expériences, formations, compétences et langues envoyées. La génération du PDF est automatique lors de la création.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titre": "CV Journey {{fj_run}} — Node.js",
      "experiences": [
        {
          "poste": "Développeur stagiaire",
          "entreprise": "Entreprise de démonstration",
          "dateDebut": "2025-07-01",
          "dateFin": "2025-08-31",
          "description": "Développement de routes Express, validations et notifications email."
        }
      ],
      "formations": [
        {
          "diplome": "Licence informatique",
          "etablissement": "Université de démonstration",
          "annee": 2025
        }
      ],
      "competences": [
        "Node.js",
        "MongoDB"
      ],
      "langues": [
        "Français",
        "Anglais"
      ],
      "lienLinkedin": "https://www.linkedin.com/in/demo-journey/"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
       const j = pm.response.json();
      pm.test("PDF absent du JSON", () => { pm.expect(j.cv).not.to.have.property("pdf"); });
      pm.test("Propri\u00e9taire correct", () => { pm.expect(j.cv.candidatId).to.eql(pm.variables.get("fj_c1_id")); });
      pm.test("Identifiant r\u00e9cup\u00e9r\u00e9 : cv", () => { const id = j.cv._id; pm.expect(id).to.be.a("string").and.match(/^[a-f0-9]{24}$/i); pm.collectionVariables.set("fj_cv", id); pm.variables.set("fj_cv", id); });

      }
      if (pm.response.code !== 201) { console.error("Prérequis échoué : arrêt du parcours."); pm.execution.setNextRequest(null); }
    language: text/javascript
order: 1000
