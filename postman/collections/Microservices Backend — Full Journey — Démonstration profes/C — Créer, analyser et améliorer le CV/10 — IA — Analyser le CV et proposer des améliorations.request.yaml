$kind: http-request
description: |-
  Étape 10/34.

  Montrer la note, le résumé, les points forts et les améliorations proposées. Cet appel peut prendre plusieurs secondes.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/{{fj_cv}}/analyse"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("fj_ai_last_start",Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("Structure de l\u2019analyse", () => { pm.expect(j.analyseIA.note).to.be.a("number").within(0,10); pm.expect(j.analyseIA.resume).to.be.a("string").and.not.empty; pm.expect(j.analyseIA.pointsForts).to.be.an("array"); pm.expect(j.analyseIA.ameliorations).to.be.an("array"); pm.expect(Number.isNaN(Date.parse(j.analyseIA.dateAnalyse))).to.eql(false); });
      pm.test("j.message", () => { pm.expect(j.message).to.eql("CV analysé avec succès"); });
      pm.collectionVariables.set("fj_ai_date", j.analyseIA.dateAnalyse);
      }
    language: text/javascript
order: 4000
