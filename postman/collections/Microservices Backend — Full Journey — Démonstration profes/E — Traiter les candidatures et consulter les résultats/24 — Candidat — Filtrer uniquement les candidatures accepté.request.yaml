$kind: http-request
name: 24 — Candidat — Filtrer uniquement les candidatures acceptées
description: |-
  Étape 24/34.

  Montrer que statut=acceptée retourne uniquement la première candidature.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/candidatures/candidat/{{fj_c1_id}}?statut=acceptée"
method: GET
queryParams:
  statut: acceptée
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(1); });
      pm.test("j.candidatures[0].statut", () => { pm.expect(j.candidatures[0].statut).to.eql("acceptée"); });

      }
    language: text/javascript
order: 6000
