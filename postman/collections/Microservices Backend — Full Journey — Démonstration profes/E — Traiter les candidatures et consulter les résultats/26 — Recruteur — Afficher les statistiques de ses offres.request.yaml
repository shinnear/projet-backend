$kind: http-request
description: |-
  Étape 26/34.

  Présenter la vue de suivi du recruteur avec les mêmes totaux pour ce scénario.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/candidatures/statistiques/recruteur"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(2); });
      pm.test("j.parStatut", () => { pm.expect(j.parStatut).to.eql({"envoyée": 0, "vue": 0, "acceptée": 1, "rejetée": 1}); });
      pm.test("j.tauxAcceptation", () => { pm.expect(j.tauxAcceptation).to.eql(50.0); });

      }
    language: text/javascript
order: 8000
