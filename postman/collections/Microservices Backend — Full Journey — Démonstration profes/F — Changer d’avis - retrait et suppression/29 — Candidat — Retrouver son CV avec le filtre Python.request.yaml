$kind: http-request
description: |-
  Étape 29/34.

  Lister ses CV en filtrant par compétence Python : seul le deuxième CV apparaît.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/user/{{fj_c1_id}}?competence=Python"
method: GET
queryParams:
  competence: Python
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(1); });

      }
    language: text/javascript
order: 3000
