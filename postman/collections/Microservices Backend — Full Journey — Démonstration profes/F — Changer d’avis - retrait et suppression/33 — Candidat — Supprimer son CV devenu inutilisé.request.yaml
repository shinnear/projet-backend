$kind: http-request
description: |-
  Étape 33/34.

  Le retrait a libéré le deuxième CV : sa suppression et celle de son PDF sont maintenant possibles.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/{{fj_cv2}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code !== 200) { console.error("Prérequis échoué : arrêt du parcours."); pm.execution.setNextRequest(null); }
    language: text/javascript
order: 7000
