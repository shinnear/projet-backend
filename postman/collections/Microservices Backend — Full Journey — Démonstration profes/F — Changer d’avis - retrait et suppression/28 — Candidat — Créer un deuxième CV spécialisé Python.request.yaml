$kind: http-request
description: |-
  Étape 28/34.

  Montrer qu’un candidat peut gérer plusieurs CV.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titre": "CV secondaire {{fj_run}}",
      "competences": [
        "Python"
      ],
      "langues": [
        "Arabe"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
       const j = pm.response.json();
      pm.test("Identifiant r\u00e9cup\u00e9r\u00e9 : cv2", () => { const id = j.cv._id; pm.expect(id).to.be.a("string").and.match(/^[a-f0-9]{24}$/i); pm.collectionVariables.set("fj_cv2", id); pm.variables.set("fj_cv2", id); });

      }
      if (pm.response.code !== 201) { console.error("Prérequis échoué : arrêt du parcours."); pm.execution.setNextRequest(null); }
    language: text/javascript
order: 2000
