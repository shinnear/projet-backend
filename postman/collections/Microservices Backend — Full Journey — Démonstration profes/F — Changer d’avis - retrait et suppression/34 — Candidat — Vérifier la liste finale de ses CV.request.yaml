$kind: http-request
description: |-
  Étape 34/34.

  Afficher tous les CV restants : seul le CV principal est conservé.

  Exécuter avec Send après l’étape précédente. Le token du bon rôle et les identifiants sont automatiques.
url: "{{fj_candidature_url}}/cvs/user/{{fj_c1_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(1); });

      }
      pm.test("Le CV principal est le seul restant", () => { const j=pm.response.json(); pm.expect(j.cvs).to.have.lengthOf(1); pm.expect(j.cvs[0]._id).to.eql(pm.collectionVariables.get("fj_cv")); });
    language: text/javascript
order: 8000
