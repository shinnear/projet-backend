$kind: http-request
description: "HTTP attendu : 200. "
url: "{{fj_gateway_url}}/api/cvs/{{fj_cv}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("M\u00eame CV via gateway", () => { pm.expect(j._id).to.eql(pm.variables.get("fj_cv")); });

      }
    language: text/javascript
order: 6000
