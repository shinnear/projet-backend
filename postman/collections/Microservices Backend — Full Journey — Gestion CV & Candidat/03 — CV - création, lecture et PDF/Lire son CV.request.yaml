$kind: http-request
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/cvs/{{fj_cv}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("Donn\u00e9es du CV", () => { pm.expect(j._id).to.eql(pm.variables.get("fj_cv")); pm.expect(j.competences).to.include("Node.js"); pm.expect(j).not.to.have.property("pdf"); });

      }
    language: text/javascript
order: 4000
