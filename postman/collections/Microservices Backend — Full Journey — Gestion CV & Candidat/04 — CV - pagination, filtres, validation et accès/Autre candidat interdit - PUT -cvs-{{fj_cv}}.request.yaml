$kind: http-request
name: "Autre candidat interdit : PUT /cvs/{{fj_cv}}"
description: "HTTP attendu : 403. "
url: "{{fj_candidature_url}}/cvs/{{fj_cv}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titre": "Modification interdite"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_c2_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => { pm.response.to.have.status(403); });
    language: text/javascript
order: 20000
