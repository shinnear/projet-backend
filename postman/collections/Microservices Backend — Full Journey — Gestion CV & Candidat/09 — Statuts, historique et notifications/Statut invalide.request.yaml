$kind: http-request
description: "HTTP attendu : 400. "
url: "{{fj_candidature_url}}/candidatures/{{fj_app_a}}/statut"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "statut": "inconnu"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => { pm.response.to.have.status(400); });
    language: text/javascript
order: 1000
