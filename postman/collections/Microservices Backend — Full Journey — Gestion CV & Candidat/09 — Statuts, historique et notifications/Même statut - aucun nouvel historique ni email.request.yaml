$kind: http-request
name: "Même statut : aucun nouvel historique ni email"
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/candidatures/{{fj_app_a}}/statut"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "statut": "vue"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.message", () => { pm.expect(j.message).to.eql("Statut déjà appliqué"); });
      pm.test("j.candidature.historiqueStatuts.length", () => { pm.expect(j.candidature.historiqueStatuts.length).to.eql(2); });
      pm.test("Pas de nouvelle notification", () => { pm.expect(j).not.to.have.property("notification"); });

      }
    language: text/javascript
order: 3000
