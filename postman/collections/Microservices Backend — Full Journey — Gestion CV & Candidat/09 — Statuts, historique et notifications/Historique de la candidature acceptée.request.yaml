$kind: http-request
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/candidatures/{{fj_app_a}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.historiqueStatuts.map(x=>x.statut)", () => { pm.expect(j.historiqueStatuts.map(x=>x.statut)).to.eql(["envoyée", "vue", "acceptée"]); });
      pm.test("Auteurs de l\u2019historique", () => { pm.expect(j.historiqueStatuts[0].auteurId).to.eql(pm.variables.get("fj_c1_id")); pm.expect(j.historiqueStatuts[1].auteurId).to.eql(pm.variables.get("fj_r1_id")); });

      }
    language: text/javascript
order: 10000
