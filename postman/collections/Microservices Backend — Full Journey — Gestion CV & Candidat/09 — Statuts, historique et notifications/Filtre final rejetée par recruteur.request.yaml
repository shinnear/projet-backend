$kind: http-request
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/candidatures/offre/{{fj_ob}}?statut=rejetée"
method: GET
queryParams:
  statut: rejetée
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(1); });
      pm.test("j.candidatures[0].statut", () => { pm.expect(j.candidatures[0].statut).to.eql("rejetée"); });

      }
    language: text/javascript
order: 12000
