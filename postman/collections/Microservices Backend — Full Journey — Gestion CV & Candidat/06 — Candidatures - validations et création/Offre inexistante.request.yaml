$kind: http-request
description: "HTTP attendu : 404. "
url: "{{fj_candidature_url}}/candidatures"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "offreId": "000000000000000000000001",
      "cvId": "{{fj_cv}}",
      "lettreMotivation": "Je souhaite rejoindre votre équipe pour développer des API Node.js.",
      "email": "{{fj_notification_email}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 404", () => { pm.response.to.have.status(404); });
    language: text/javascript
order: 8000
