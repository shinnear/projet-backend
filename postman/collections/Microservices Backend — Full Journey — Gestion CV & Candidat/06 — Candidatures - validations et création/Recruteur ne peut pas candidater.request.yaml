$kind: http-request
description: "HTTP attendu : 403. "
url: "{{fj_candidature_url}}/candidatures"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "offreId": "{{fj_oa}}",
      "cvId": "{{fj_cv}}",
      "lettreMotivation": "Je souhaite rejoindre votre équipe pour développer des API Node.js.",
      "email": "{{fj_notification_email}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{fj_r1_token}}"
scripts:
  - type: afterResponse
    code: pm.test("HTTP 403", () => { pm.response.to.have.status(403); });
    language: text/javascript
order: 13000
