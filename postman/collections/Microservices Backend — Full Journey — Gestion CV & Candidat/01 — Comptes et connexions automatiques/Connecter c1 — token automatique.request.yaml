$kind: http-request
description: "HTTP attendu : 200. Échec bloquant pour les étapes dépendantes."
url: "{{fj_user_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{fj_c1_email}}",
      "password": "{{fj_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("Identifiant r\u00e9cup\u00e9r\u00e9 : c1_id", () => { const id = j.user.id; pm.expect(id).to.be.a("string").and.match(/^[a-f0-9]{24}$/i); pm.collectionVariables.set("fj_c1_id", id); pm.variables.set("fj_c1_id", id); });
      pm.test("Token re\u00e7u", () => { pm.expect(j.token).to.be.a("string").and.not.empty; pm.collectionVariables.set("fj_c1_token",j.token); pm.variables.set("fj_c1_token",j.token); });
      pm.test("j.user.role", () => { pm.expect(j.user.role).to.eql("candidat"); });

      }
      if (pm.response.code !== 200) { console.error("Prérequis échoué : arrêt du parcours."); pm.execution.setNextRequest(null); }
    language: text/javascript
order: 2000
