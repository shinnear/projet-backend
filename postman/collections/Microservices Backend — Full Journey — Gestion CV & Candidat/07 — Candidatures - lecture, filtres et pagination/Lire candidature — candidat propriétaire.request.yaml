$kind: http-request
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/candidatures/{{fj_app_a}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.statut", () => { pm.expect(j.statut).to.eql("envoyée"); });
      pm.test("CV joint et champs priv\u00e9s absents", () => { pm.expect(j.cvId._id).to.eql(pm.variables.get("fj_cv")); pm.expect(j.cvId).not.to.have.property("pdf"); pm.expect(j.cvId).not.to.have.property("analyseIA"); pm.expect(j).not.to.have.property("emailNotification"); });

      }
    language: text/javascript
order: 1000
