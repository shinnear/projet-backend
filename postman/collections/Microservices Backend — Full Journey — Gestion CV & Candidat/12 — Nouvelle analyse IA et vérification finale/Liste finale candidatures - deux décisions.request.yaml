$kind: http-request
name: "Liste finale candidatures : deux décisions"
description: "HTTP attendu : 200. "
url: "{{fj_candidature_url}}/candidatures/candidat/{{fj_c1_id}}?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{fj_c1_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => { pm.response.to.have.status(200); });
      if (pm.response.code === 200) {
       const j = pm.response.json();
      pm.test("j.total", () => { pm.expect(j.total).to.eql(2); });
      pm.test("j.candidatures.map(x=>x.statut).sort()", () => { pm.expect(j.candidatures.map(x=>x.statut).sort()).to.eql(["acceptée", "rejetée"]); });

      }
    language: text/javascript
order: 5000
